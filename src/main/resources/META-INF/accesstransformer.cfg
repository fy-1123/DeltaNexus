# 2.0.8 UI 重构：背包界面（BackpackScreen）需要重映射原版 InventoryMenu
# 槽位到三列布局坐标，而 1.20.1 中 Slot.x/y 为 public final，无法直接赋值。
# 通过 AT 去除 final 限制（Quark 等模组同款做法），仅影响字段可写性。
# 注意：AT 必须使用 SRG 字段名（Forge 规范），SRG->official 映射：f_40220_=x, f_40221_=y
public-f net.minecraft.world.inventory.Slot f_40220_ # x
public-f net.minecraft.world.inventory.Slot f_40221_ # y
